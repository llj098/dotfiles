# https://github.com/dreamsofcode-io/tmux/blob/main/tmux.conf
#set-option -sa terminal-overrides ",xterm*:Tc"
set-option escape-time 100
set -g set-titles on

# Enable CSI-u/extended key reporting so modified keys like Shift/Ctrl/Alt+Enter survive tmux.
set -g extended-keys on

# 允许应用通过 DCS tmux;... 形式做终端 passthrough；它不会自动把普通 OSC 133 转发给 WezTerm。
# pi 的 OSC 133 prompt 标记由 tmux 自己识别，Shift+↑/↓ 见下方 previous/next-prompt 绑定。
set -g allow-passthrough on
set-option -g history-limit 500000

set -g prefix C-s
unbind C-b

# 不知道为什么，设置为 xterm-kitty, emacs 的主题居然正常了
# screen-256color, xterm-256color 都无法显示正常..
# 但是现在不用 emacs 在终端，现在这样
set -g default-terminal "xterm-256color"
#set -g default-terminal "xterm-kitty"


# tmux 自己对内报告为 tmux-256color（更标准）
set -g default-terminal "tmux-256color"

# 告诉 tmux：外面的终端（Alacritty）支持 RGB 真彩
set -as terminal-features ",alacritty*:RGB"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",wezterm*:RGB"


# Alt+←/→ 切 pane；Alt+↑/↓ 翻 tmux 历史页
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
# Alt+↑/↓: tmux page up/down（进入 copy-mode 后翻页）
bind -n M-Up copy-mode -eu
bind -n M-Down copy-mode -ed

bind -n M-H select-pane -L
bind -n M-J select-pane -U
unbind -n C-j
bind -n C-h select-pane -L
bind j select-pane -U
bind h select-pane -L

# Shift arrow shortcuts
bind -n S-Left  previous-window
bind -n S-Right next-window

# pi coding agent 会输出 OSC 133 标记；tmux 可用 previous/next-prompt 在消息块间跳转。
# WezTerm 配置会在 foreground 是 tmux 时把 Shift+↑/↓ 发送进来。
bind -n S-Up copy-mode -e \; send-keys -X previous-prompt
bind -n S-Down copy-mode -e \; send-keys -X next-prompt
bind -T copy-mode S-Up send-keys -X previous-prompt
bind -T copy-mode S-Down send-keys -X next-prompt
bind -T copy-mode-vi S-Up send-keys -X previous-prompt
bind -T copy-mode-vi S-Down send-keys -X next-prompt

bind -T copy-mode M-Up send-keys -X page-up
bind -T copy-mode M-Down send-keys -X page-down
bind -T copy-mode-vi M-Up send-keys -X page-up
bind -T copy-mode-vi M-Down send-keys -X page-down

bind -n M-j select-window -n
bind -n M-k select-window -p

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"


# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on






# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

set -g @plugin "nordtheme/tmux"
#set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

run-shell '~/.tmux/plugins/tmux/nord.tmux'
