<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    Use Simplified Chinese glyph forms for CJK.

    noto-fonts-cjk is a single .ttc holding the JP, KR, SC, TC and HK faces in
    that order, so fontconfig's charset scan lands on JP. Result: 复 renders
    about 30% too narrow and 门 gets the Japanese stroke forms.

    The Arch Wiki recipe for this bug (alias/prefer "Noto Sans CJK SC" onto
    sans-serif, serif and monospace) does not work on this machine.
    50-omarchy.conf rewrites those generic families with mode="assign"
    binding="strong", and user config loads afterwards (50-user.conf sorts after
    50-omarchy.conf), so the pattern no longer contains the generic name and the
    alias test never matches. Chromium's per-character fallback
    (ui/gfx/font_fallback_linux.cc) builds a pattern with no family at all,
    which is exactly the case that fails.

    selectfont is order independent and does not care which family ends up in
    the pattern, so it keeps working when omarchy-font-set changes the default
    font. Dropping the non-SC faces leaves exactly one CJK candidate, SC, for
    sans, serif, mono and every weight; other scripts are untouched.

    Trade-off: Japanese, Korean and Traditional text also renders with SC forms.
    It stays readable (SC covers kana, Hangul and the shared kanji), and the
    non-SC faces are hidden from font pickers. Delete this file to restore
    per-region forms.

    Chromium and Brave cache fontconfig at startup: restart the browser.
  -->
  <selectfont>
    <rejectfont>
      <!-- Noto Sans CJK -->
      <pattern><patelt name="family"><string>Noto Sans CJK JP</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Sans CJK KR</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Sans CJK TC</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Sans CJK HK</string></patelt></pattern>
      <!-- Noto Sans Mono CJK -->
      <pattern><patelt name="family"><string>Noto Sans Mono CJK JP</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Sans Mono CJK KR</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Sans Mono CJK TC</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Sans Mono CJK HK</string></patelt></pattern>
      <!-- Noto Serif CJK -->
      <pattern><patelt name="family"><string>Noto Serif CJK JP</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Serif CJK KR</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Serif CJK TC</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Serif CJK HK</string></patelt></pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
