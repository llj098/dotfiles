# Trigger Mode
TriggerMode=Hold
# Command Keys
# Must stay empty: right Ctrl is the hold trigger, and lifting it into command
# mode stopped the trigger from firing cleanly.
CommandKeys=
# Postprocess Menu Keys
SceneMenuKey=

[TriggerKey]
0=Control+Control_R

[AsrMenuKey]
0=F8

[PagePrevKeys]
0=Page_Up
1=KP_Page_Up

[PageNextKeys]
0=Next
1=KP_Next
